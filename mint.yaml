version: 1
name: Myers Park Athletic Zone
slug: myersparkathleticzone
summary: >-
  Schedules, teams, rosters, coaches, news and broadcast links for Myers
  Park High School athletics
env:
  - name: MPAZ_SITE_URL
    required: false
    help: >-
      Optional; defaults to www.myersparkathleticzone.com. Hosted (mint)
      deployments are Myers Park only: their egress allow list permits just that host,
      so pointing this at another Athletic Zone school fails every call.
      Other schools work only with a local stdio install.
  - name: MPAZ_SCHOOL_ID
    required: false
    help: >-
      Optional. GoFan/PlayOn school id used to tell your teams from opponents;
      defaults to 10150.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    - www.myersparkathleticzone.com
examples:
  - prompt: What Myers Park games are coming up this week, and where are they being played?
    note: Reads the all-school upcoming-events window.
  - prompt: How has the Myers Park varsity football team done so far this season? List each result and the overall record.
    note: Resolves the team, then reads its completed games and scores.
  - prompt: Summarize the latest Myers Park athletics news and list any game broadcast links on the site.
    note: Reads homepage news posts and NFHS Network broadcast links.
